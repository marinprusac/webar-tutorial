<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR chair (marker)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <div id="overlay">Point the camera at the <a href="card.png" style="color: white;">marker image</a></div>

    <a-scene mindar-image="imageTargetSrc: card.mind; uiScanning: no"
        color-space="sRGB" renderer="colorManagement: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="chairModel" src="chair.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- marker is 1 unit wide, chair is rotated so it stands on the image -->
        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <a-entity rotation="90 0 0">
                <a-gltf-model src="#chairModel" scale="0.5 0.5 0.5"
                    animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true"></a-gltf-model>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        // show/hide the text when marker is found or lost
        var target = document.getElementById("target");
        var overlay = document.getElementById("overlay");
        target.addEventListener("targetFound", function () {
            overlay.textContent = "Found it!";
        });
        target.addEventListener("targetLost", function () {
            overlay.innerHTML = 'Point the camera at the <a href="card.png" style="color: white;">marker image</a>';
        });
    </script>

</body>
</html>
